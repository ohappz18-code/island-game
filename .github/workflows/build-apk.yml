name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4      
      - name: Arrange files
        run: |
          mkdir -p www tools res
          mv -f index.html www/index.html
          mv -f patch.py render.py tools/
          mv -f full.png fg.png full.svg fg.svg res/
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - run: python tools/patch.py
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: island-survival-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
